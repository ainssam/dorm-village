name: Cooking browser smoke
on:
  push:
    branches: [qa/cooking-browser-2026-11-19]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - { width: 390, height: 844, touch: '1' }
          - { width: 844, height: 390, touch: '1' }
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: |
          npm run serve > /tmp/dorm-village-server.log 2>&1 &
          curl --retry 12 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/ -o /dev/null
          node scripts/cooking-recovery-browser-smoke.mjs
        env:
          QA_WIDTH: ${{ matrix.width }}
          QA_HEIGHT: ${{ matrix.height }}
          QA_TOUCH: ${{ matrix.touch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cooking-browser-${{ matrix.width }}x${{ matrix.height }}
          path: game/qa/cooking-recovery-browser
