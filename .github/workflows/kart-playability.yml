name: Check actual kart playability
on:
  push:
    branches: [qa/kart-card-before-2026-11-21]
permissions:
  contents: read
jobs:
  kart:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {width: 320, height: 568, touch: '1'}
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Select Chrome
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Drive an actual lap and exit
        run: |
          npm run serve > /tmp/dorm-village-server.log 2>&1 &
          curl --retry 12 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173/ -o /dev/null
          node scripts/kart-playability-2026-11-21.mjs
        env:
          QA_WIDTH: ${{ matrix.width }}
          QA_HEIGHT: ${{ matrix.height }}
          QA_TOUCH: ${{ matrix.touch }}
          QA_ONLY_CARD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kart-${{ matrix.width }}x${{ matrix.height }}
          path: game/qa/kart-playability
