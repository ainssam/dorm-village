name: Classroom viewport candidate
on:
  push:
    branches: [qa/classroom-framing-fix-2026-11-21]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, channel: msedge, width: 1440, height: 900, touch: '0'}
          - {runner: ubuntu-24.04, channel: '', width: 390, height: 844, touch: '1'}
          - {runner: ubuntu-24.04, channel: '', width: 768, height: 1024, touch: '1'}
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Configure Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Run Chrome capture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node scripts/serve.mjs > server.log 2>&1 &
          node scripts/classroom-viewport-audit.mjs
        env:
          QA_WIDTH: ${{ matrix.width }}
          QA_HEIGHT: ${{ matrix.height }}
          QA_TOUCH: ${{ matrix.touch }}
          QA_CHANNEL: ${{ matrix.channel }}
      - name: Run Edge capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process -FilePath 'node' -ArgumentList 'scripts/serve.mjs' -RedirectStandardOutput server-output.log -RedirectStandardError server-error.log -NoNewWindow -PassThru
          try { node scripts/classroom-viewport-audit.mjs; $testCode=$LASTEXITCODE }
          finally { Stop-Process -Id $server.Id -ErrorAction SilentlyContinue }
          exit $testCode
        env:
          QA_WIDTH: ${{ matrix.width }}
          QA_HEIGHT: ${{ matrix.height }}
          QA_TOUCH: ${{ matrix.touch }}
          QA_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-${{ matrix.width }}x${{ matrix.height }}
          path: game/qa/classroom-viewport
