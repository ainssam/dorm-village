name: Use village facilities and return to the world
on:
  push:
    branches: [qa/village-use-roundtrip-2026-11-21]
permissions:
  contents: read
jobs:
  use:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        layout: [pc, phone]
        suite: [social, group]
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: |
          node scripts/serve.mjs > /tmp/dorm-village-actual-use.txt 2>&1 &
          node scripts/village-use-roundtrip.mjs
        env:
          VILLAGE_LAYOUT: ${{ matrix.layout }}
          VILLAGE_SUITE: ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-${{ matrix.suite }}-${{ matrix.layout }}
          path: game/qa/village-use-roundtrip
