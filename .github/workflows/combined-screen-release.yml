name: Dorm Village combined release tests
on:
  push:
    branches: [qa/combined-world-release-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0f2a4d7676993d3d26a67be39e7cc544b3641de7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "0f2a4d7676993d3d26a67be39e7cc544b3641de7"
          npm ci
          npm run check
          npm test
