name: Dorm Village combined release tests
on:
  push:
    branches: [qa/combined-kart-release-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad6ecd43f7dfbe5f7e67d761bc0a95095ae69833
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "ad6ecd43f7dfbe5f7e67d761bc0a95095ae69833"
          npm ci
          npm run check
          npm test
