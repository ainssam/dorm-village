name: Dorm Village combined release tests
on:
  push:
    branches: [qa/world-release-after-gym-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51d8e684be0e39d3a65d332321fc53a73ef79b25
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "51d8e684be0e39d3a65d332321fc53a73ef79b25"
          npm ci
          npm run check
          npm test
