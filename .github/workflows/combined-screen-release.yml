name: Dorm Village combined release tests
on:
  push:
    branches: [qa/world-release-exact-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d00794465f0dc8e0293b498297463d001e8d522
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "7d00794465f0dc8e0293b498297463d001e8d522"
          npm ci
          npm run check
          npm test
