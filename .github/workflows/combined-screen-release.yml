name: Dorm Village combined release tests
on:
  push:
    branches: [qa/world-release-final-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2714bf09eb383c02143cbe895b7883ed7a3238a2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "2714bf09eb383c02143cbe895b7883ed7a3238a2"
          npm ci
          npm run check
          npm test
