name: Dorm Village combined release tests
on:
  push:
    branches: [qa/combined-screen-release-2026-11-21]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 27db4aa8e4446e863487715e2b8141e17bc23953
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json
      - working-directory: game
        run: |
          test "$(git rev-parse HEAD)" = "27db4aa8e4446e863487715e2b8141e17bc23953"
          npm ci
          npm run check
          npm test
